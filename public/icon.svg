<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rcgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2246" />
      <stop offset="100%" stop-color="#061226" />
    </linearGradient>
    <filter id="rcgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base matching RCG dark navy theme -->
  <rect width="512" height="512" rx="112" fill="url(#rcgBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1D63FF" stroke-width="4" opacity="0.4" />

  <!-- RCG Main Logo Mark -->
  <g transform="translate(68, 140) scale(1.0)" filter="url(#rcgShadow)">
    
    <!-- Letter R -->
    <polygon points="0,4 0,48 44,48" fill="#1D63FF" />
    <path fill="#FFFFFF" d="
      M 0 0 
      L 98 0 
      C 118 0 128 10 128 30 
      C 128 50 118 60 98 60 
      L 130 116 
      L 94 116 
      L 68 62 
      L 28 62 
      L 28 116 
      L 0 116 
      Z
      M 28 20 
      L 28 44 
      L 94 44 
      C 100 44 104 40 104 32 
      C 104 24 100 20 94 20 
      Z
    " />

    <!-- Letter C -->
    <g transform="translate(136, 0)">
      <path fill="#FFFFFF" d="
        M 100 20 
        L 32 20 
        C 18 20 12 28 12 42 
        L 12 74 
        C 12 88 18 96 32 96 
        L 100 96 
        L 100 116 
        L 28 116 
        C 8 116 0 102 0 82 
        L 0 34 
        C 0 14 8 0 28 0 
        L 100 0 
        Z
      " />
    </g>

    <!-- Letter G -->
    <g transform="translate(254, 0)">
      <polygon points="68,26 110,26 110,68" fill="#1D63FF" />
      <path fill="#FFFFFF" d="
        M 80 0 
        L 28 0 
        C 8 0 0 14 0 34 
        L 0 82 
        C 0 102 8 116 28 116 
        L 86 116 
        C 104 116 112 104 112 86 
        L 112 50 
        L 56 50 
        L 56 70 
        L 88 70 
        C 88 78 86 84 80 88 
        C 76 92 68 96 56 96 
        L 32 96 
        C 18 96 12 88 12 74 
        L 12 42 
        C 12 28 18 20 32 20 
        L 80 20 
        Z
      " />
    </g>

    <!-- Subtitle: WOODWORKING SOLUTIONS -->
    <text x="182" y="152" text-anchor="middle" font-size="14.5" font-family="'Arial Black', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" fill="#FFFFFF" letter-spacing="4.5">
      WOODWORKING SOLUTIONS
    </text>
  </g>

  <!-- Persian title badge at bottom -->
  <g transform="translate(256, 435)">
    <rect x="-85" y="-17" width="170" height="34" rx="17" fill="#1D63FF" opacity="0.9" />
    <text x="0" y="6" font-family="'Vazirmatn', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">گروه صنعتی آرسی</text>
  </g>
</svg>
